<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIO 101 Quiz — KASU PharmD</title>
<style>
  :root {
    --green:#16a34a;--dgreen:#14532d;--light:#f0fdf4;--card:#fff;
    --border:#bbf7d0;--accent:#15803d;--warn:#dc2626;--gold:#ca8a04;
    --gray:#6b7280;--dark:#111827;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#064e3b 0%,#065f46 50%,#047857 100%);min-height:100vh;padding:16px}
  h1{text-align:center;color:#fff;font-size:1.6rem;margin-bottom:4px;text-shadow:0 2px 8px #0008}
  .subtitle{text-align:center;color:#a7f3d0;font-size:.85rem;margin-bottom:18px}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 32px #0004;max-width:780px;margin:0 auto}

  /* SETUP SCREEN */
  #setup h2{color:var(--dgreen);font-size:1.2rem;margin-bottom:14px;text-align:center}
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .topic-btn{background:var(--light);border:2px solid var(--border);border-radius:10px;padding:10px 12px;
    cursor:pointer;font-size:.82rem;color:var(--dark);transition:.2s;text-align:left}
  .topic-btn.active{background:#dcfce7;border-color:var(--green);color:var(--dgreen);font-weight:700}
  .topic-btn:hover{border-color:var(--green)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  label{font-size:.85rem;color:var(--gray);font-weight:600}
  input[type=number]{width:80px;padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-size:.9rem}
  select{padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-size:.85rem;background:#fff}
  .btn{padding:11px 22px;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s}
  .btn-green{background:var(--green);color:#fff}
  .btn-green:hover{background:var(--dgreen)}
  .btn-gray{background:#e5e7eb;color:#374151}
  .btn-gray:hover{background:#d1d5db}
  .btn-sm{padding:7px 15px;font-size:.82rem}
  #qcount-info{font-size:.8rem;color:var(--gray);margin-top:4px}

  /* QUIZ SCREEN */
  #quiz{display:none}
  .progress-bar{height:8px;background:#d1fae5;border-radius:99px;margin-bottom:16px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#10b981);border-radius:99px;transition:.4s}
  .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
  .q-num{font-size:.8rem;color:var(--gray);font-weight:600}
  .timer-badge{background:var(--dgreen);color:#fff;border-radius:20px;padding:4px 12px;font-size:.82rem;font-weight:700}
  .timer-badge.warn{background:var(--warn)}
  .section-tag{background:#dcfce7;color:var(--dgreen);border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:700}
  .q-text{font-size:.95rem;font-weight:700;color:var(--dark);margin-bottom:14px;line-height:1.5}
  .options{display:grid;gap:9px}
  .opt{display:flex;align-items:center;gap:10px;background:var(--light);border:2px solid var(--border);
    border-radius:10px;padding:11px 14px;cursor:pointer;font-size:.88rem;color:var(--dark);transition:.2s}
  .opt:hover:not(.locked){background:#dcfce7;border-color:var(--green)}
  .opt.selected{background:#dcfce7;border-color:var(--green)}
  .opt.correct{background:#dcfce7;border-color:#16a34a;font-weight:700}
  .opt.wrong{background:#fee2e2;border-color:#dc2626}
  .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;
    font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;display:none}
  .feedback.correct{background:#dcfce7;color:var(--dgreen);display:block}
  .feedback.wrong{background:#fee2e2;color:var(--warn);display:block}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:8px}
  .skip-btn{background:none;border:2px solid var(--border);border-radius:8px;padding:7px 14px;
    font-size:.82rem;color:var(--gray);cursor:pointer;font-weight:600}
  .skip-btn:hover{border-color:var(--gray)}

  /* RESULTS SCREEN */
  #results{display:none}
  .score-circle{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:2rem;
    border:6px solid var(--green);color:var(--dgreen);background:var(--light)}
  .score-circle small{font-size:.65rem;font-weight:600;color:var(--gray)}
  .grade-badge{text-align:center;font-size:1.1rem;font-weight:700;margin-bottom:14px;padding:8px;
    border-radius:10px;background:var(--light);color:var(--dgreen)}
  .stat-row{display:flex;justify-content:space-around;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .stat{text-align:center;background:var(--light);border-radius:10px;padding:10px 16px;min-width:80px}
  .stat .val{font-size:1.3rem;font-weight:800;color:var(--dgreen)}
  .stat .lbl{font-size:.72rem;color:var(--gray);font-weight:600}
  .review-item{border-left:4px solid var(--border);padding:10px 14px;margin-bottom:10px;
    background:var(--light);border-radius:0 10px 10px 0;font-size:.83rem}
  .review-item.r-correct{border-color:var(--green)}
  .review-item.r-wrong{border-color:var(--warn)}
  .review-q{font-weight:700;color:var(--dark);margin-bottom:4px}
  .review-ans{color:var(--gray)}
  .review-ans span.ok{color:var(--green);font-weight:700}
  .review-ans span.bad{color:var(--warn);font-weight:700}
  #review-toggle{cursor:pointer;color:var(--green);font-size:.85rem;font-weight:700;
    background:none;border:none;text-decoration:underline;margin-bottom:10px}
  @media(max-width:500px){.topic-grid{grid-template-columns:1fr}.row{gap:6px}}
</style>
</head>
<body>
<h1>🌿 BIO 101 Interactive Quiz</h1>
<p class="subtitle">KASU PharmD · First Year · Comprehensive Exam Practice</p>

<!-- SETUP -->
<div class="card" id="setup">
  <h2>⚙️ Configure Your Quiz Session</h2>
  <label style="display:block;margin-bottom:8px;font-size:.88rem;color:var(--dgreen);font-weight:700">📚 Select Topic(s):</label>
  <div class="topic-grid" id="topic-grid"></div>

  <div class="row" style="margin-top:4px">
    <label>❓ No. of Questions:</label>
    <input type="number" id="qcount" min="1" value="20">
    <label>⏱ Timer per Q:</label>
    <select id="timer-sel">
      <option value="0">No Timer</option>
      <option value="30">30 sec</option>
      <option value="45" selected>45 sec</option>
      <option value="60">60 sec</option>
      <option value="90">90 sec</option>
    </select>
  </div>
  <div id="qcount-info"></div>
  <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn btn-green" onclick="startQuiz()">🚀 Start Quiz</button>
    <button class="btn btn-gray btn-sm" onclick="selectAll()">Select All Topics</button>
    <button class="btn btn-gray btn-sm" onclick="deselectAll()">Clear Selection</button>
  </div>
</div>

<!-- QUIZ -->
<div class="card" id="quiz">
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div class="q-header">
    <span class="q-num" id="qnum"></span>
    <span class="section-tag" id="sec-tag"></span>
    <span class="timer-badge" id="timer-badge" style="display:none">⏱ --</span>
  </div>
  <div class="q-text" id="qtext"></div>
  <div class="options" id="opts"></div>
  <div class="feedback" id="feedback"></div>
  <div class="nav-row">
    <button class="skip-btn" onclick="skipQ()">⏭ Skip</button>
    <div style="display:flex;gap:8px">
      <button class="btn btn-gray btn-sm" id="prev-btn" onclick="prevQ()">◀ Prev</button>
      <button class="btn btn-green" id="next-btn" onclick="nextQ()">Next ▶</button>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div class="card" id="results">
  <h2 style="text-align:center;color:var(--dgreen);margin-bottom:14px">📊 Quiz Results</h2>
  <div class="score-circle" id="score-circle"></div>
  <div class="grade-badge" id="grade-badge"></div>
  <div class="stat-row" id="stat-row"></div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn btn-green" onclick="retryQuiz()">🔁 Retry Same Questions</button>
    <button class="btn btn-gray" onclick="goSetup()">🏠 New Quiz</button>
  </div>
  <button id="review-toggle" onclick="toggleReview()">📝 Show Answer Review</button>
  <div id="review-list" style="display:none"></div>
</div>

<script>

// Topic list
const TOPICS = [...new Set(ALL_QS.map(q=>q.s))];
let selected = new Set(TOPICS);
let quizQs=[], cur=0, answers=[], skipped=[], timer=null, timerSec=0, timerMax=0;

// Build topic buttons
const tg = document.getElementById('topic-grid');
TOPICS.forEach(t=>{
  const b=document.createElement('button');
  b.className='topic-btn active';
  b.textContent=t+' ('+ALL_QS.filter(q=>q.s===t).length+' Qs)';
  b.dataset.t=t;
  b.onclick=()=>{
    if(selected.has(t)){if(selected.size>1){selected.delete(t);b.className='topic-btn';}}
    else{selected.add(t);b.className='topic-btn active';}
    updateInfo();
  };
  tg.appendChild(b);
});
function updateInfo(){
  const pool=ALL_QS.filter(q=>selected.has(q.s));
  document.getElementById('qcount-info').textContent=`Available: ${pool.length} questions from selected topics`;
  const inp=document.getElementById('qcount');
  if(parseInt(inp.value)>pool.length) inp.value=pool.length;
}
function selectAll(){selected=new Set(TOPICS);document.querySelectorAll('.topic-btn').forEach(b=>b.className='topic-btn active');updateInfo();}
function deselectAll(){
  const first=TOPICS[0];selected=new Set([first]);
  document.querySelectorAll('.topic-btn').forEach(b=>{b.className='topic-btn';if(b.dataset.t===first)b.className='topic-btn active';});
  updateInfo();
}
updateInfo();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(){
  const pool=shuffle(ALL_QS.filter(q=>selected.has(q.s)));
  let n=parseInt(document.getElementById('qcount').value)||20;
  n=Math.min(n,pool.length);
  quizQs=pool.slice(0,n);
  answers=new Array(n).fill(null);
  skipped=new Array(n).fill(false);
  cur=0;
  timerMax=parseInt(document.getElementById('timer-sel').value)||0;
  document.getElementById('setup').style.display='none';
  document.getElementById('quiz').style.display='block';
  showQ();
}

function showQ(){
  const q=quizQs[cur], total=quizQs.length;
  document.getElementById('prog').style.width=((cur/total)*100)+'%';
  document.getElementById('qnum').textContent=`Question ${cur+1} of ${total}`;
  document.getElementById('sec-tag').textContent=q.s;
  document.getElementById('qtext').textContent=(cur+1)+'. '+q.q;
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  const letters=['A','B','C','D'];
  q.opts.forEach((o,i)=>{
    const d=document.createElement('div');
    d.className='opt'+(answers[cur]===i?' selected':'');
    d.innerHTML=`<div class="opt-letter">${letters[i]}</div><span>${o}</span>`;
    if(answers[cur]!==null){
      d.classList.add('locked');
      if(i===q.a) d.classList.add('correct');
      else if(answers[cur]===i) d.classList.add('wrong');
    } else {
      d.onclick=()=>selectOpt(i);
    }
    opts.appendChild(d);
  });
  document.getElementById('prev-btn').style.visibility=cur>0?'visible':'hidden';
  document.getElementById('next-btn').textContent=cur===total-1?'Finish ✓':'Next ▶';
  if(answers[cur]!==null) showFeedback(answers[cur]===quizQs[cur].a);
  clearInterval(timer);
  if(timerMax>0 && answers[cur]===null){
    timerSec=timerMax;
    updateTimerBadge();
    document.getElementById('timer-badge').style.display='';
    timer=setInterval(()=>{
      timerSec--;
      updateTimerBadge();
      if(timerSec<=0){clearInterval(timer);autoSkip();}
    },1000);
  } else {
    document.getElementById('timer-badge').style.display='none';
  }
}

function updateTimerBadge(){
  const b=document.getElementById('timer-badge');
  b.textContent='⏱ '+timerSec+'s';
  b.className='timer-badge'+(timerSec<=10?' warn':'');
}
function autoSkip(){if(answers[cur]===null){skipped[cur]=true;nextQ();}}

function selectOpt(i){
  if(answers[cur]!==null) return;
  clearInterval(timer);
  document.getElementById('timer-badge').style.display='none';
  answers[cur]=i;
  const correct=i===quizQs[cur].a;
  document.querySelectorAll('.opt').forEach((d,idx)=>{
    d.classList.add('locked');
    d.onclick=null;
    if(idx===quizQs[cur].a) d.classList.add('correct');
    else if(idx===i) d.classList.add('wrong');
  });
  showFeedback(correct);
}

function showFeedback(correct){
  const fb=document.getElementById('feedback');
  if(correct){
    fb.textContent='✅ Correct! Well done.';
    fb.className='feedback correct';
  } else {
    fb.textContent='❌ Incorrect. Correct answer: '+quizQs[cur].opts[quizQs[cur].a];
    fb.className='feedback wrong';
  }
}

function nextQ(){
  clearInterval(timer);
  if(cur<quizQs.length-1){cur++;showQ();}
  else finishQuiz();
}
function prevQ(){clearInterval(timer);if(cur>0){cur--;showQ();}}
function skipQ(){if(answers[cur]===null){clearInterval(timer);skipped[cur]=true;nextQ();}}

function finishQuiz(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('results').style.display='block';
  const total=quizQs.length;
  const correct=answers.filter((a,i)=>a===quizQs[i].a).length;
  const skippedCount=skipped.filter(Boolean).length;
  const wrong=total-correct-skippedCount;
  const pct=Math.round((correct/total)*100);
  const circle=document.getElementById('score-circle');
  circle.innerHTML=`${pct}%<small>${correct}/${total} correct</small>`;
  let grade='',gc='';
  if(pct>=70){grade='🎉 PASS — Great Work!';gc='#16a34a';}
  else if(pct>=50){grade='⚠️ BORDERLINE — Keep Studying!';gc='#ca8a04';}
  else{grade='❌ FAIL — More Revision Needed';gc='#dc2626';}
  const gb=document.getElementById('grade-badge');
  gb.textContent=grade;gb.style.color=gc;
  document.getElementById('stat-row').innerHTML=`
    <div class="stat"><div class="val" style="color:#16a34a">${correct}</div><div class="lbl">Correct</div></div>
    <div class="stat"><div class="val" style="color:#dc2626">${wrong}</div><div class="lbl">Wrong</div></div>
    <div class="stat"><div class="val" style="color:#ca8a04">${skippedCount}</div><div class="lbl">Skipped</div></div>
    <div class="stat"><div class="val">${pct}%</div><div class="lbl">Score</div></div>`;
  // Build review
  const rl=document.getElementById('review-list');
  rl.innerHTML='';
  quizQs.forEach((q,i)=>{
    const d=document.createElement('div');
    const correct_q=answers[i]===q.a;
    d.className='review-item '+(answers[i]===null?'':correct_q?'r-correct':'r-wrong');
    const yourAns=answers[i]!==null?q.opts[answers[i]]:'(Skipped)';
    d.innerHTML=`<div class="review-q">${i+1}. ${q.q}</div>
      <div class="review-ans">Your answer: <span class="${answers[i]===null?'':'correct_q'?'ok':'bad'}">${yourAns}</span><br>
      Correct: <span class="ok">${q.opts[q.a]}</span></div>`;
    rl.appendChild(d);
  });
}

let reviewVisible=false;
function toggleReview(){
  reviewVisible=!reviewVisible;
  document.getElementById('review-list').style.display=reviewVisible?'block':'none';
  document.getElementById('review-toggle').textContent=reviewVisible?'📝 Hide Answer Review':'📝 Show Answer Review';
}
function retryQuiz(){
  answers=new Array(quizQs.length).fill(null);
  skipped=new Array(quizQs.length).fill(false);
  cur=0;reviewVisible=false;
  document.getElementById('review-list').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('quiz').style.display='block';
  showQ();
}
function goSetup(){
  clearInterval(timer);
  document.getElementById('results').style.display='none';
  document.getElementById('setup').style.display='block';
  reviewVisible=false;
}
</script>
